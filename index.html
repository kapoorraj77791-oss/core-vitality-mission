<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gagan Verma - Certified Wellness Coach | Ludhiana</title>
<style>
:root{--primary-green:#7CB342;--dark-green:#558B2F;--accent-green:#9CCC65;--black:#1a1a1a;--gray:#4a4a4a;--light-bg:#f4f7f4;--white:#ffffff;--danger:#e53935}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#f4f7f4 0%,#e8f0e8 100%);color:var(--black);line-height:1.6}
.texture-overlay{position:fixed;inset:0;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">ircle cx="50" cy="50" r="1" fill="%23558B2F" opacity="0.03"/></svg>');background-size:50px 50px;pointer-events:none;z-index:1}
.container{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:20px}
.organization-header{position:fixed;top:20px;left:20px;background:rgba(255,255,255,.95);padding:14px 22px;border-radius:12px;box-shadow:0 6px 22px rgba(85,139,47,.18);z-index:1000;border:2px solid var(--primary-green);backdrop-filter:blur(6px)}
.organization-header h3{margin:0;color:var(--dark-green);font-size:1.15em;font-weight:800}
@media(max-width:768px){.organization-header{position:static;margin:0 0 16px 0;text-align:center}}
.btn{background:linear-gradient(135deg,var(--primary-green) 0%,var(--dark-green) 100%);color:#fff;border:none;padding:12px 26px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(124,179,66,.25)}
.btn-secondary{background:var(--black)}.btn-danger{background:var(--danger)}
.toggle-admin{position:fixed;bottom:20px;right:20px;background:var(--dark-green);color:#fff;border:none;padding:14px 22px;border-radius:999px;cursor:pointer;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.25);z-index:1200}
.admin-panel{display:none;background:#fff;border-radius:16px;padding:26px;margin-bottom:30px;box-shadow:0 10px 30px rgba(85,139,47,.12);border:2px solid var(--primary-green)}
.admin-panel h2{color:var(--dark-green);margin-bottom:16px}
.admin-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:18px}
.control-group{display:flex;flex-direction:column;gap:8px}
.control-group label{font-weight:700;color:var(--gray);font-size:14px}
.control-group input,.control-group textarea{padding:12px;border:2px solid var(--accent-green);border-radius:10px;font-size:16px;transition:all .25s ease}
.control-group textarea{resize:vertical}
.success-message{background:#4CAF50;color:#fff;padding:14px;border-radius:10px;margin-top:14px;display:none;font-weight:700}
/* STATS BAR */
.stats-bar{background:linear-gradient(135deg,var(--dark-green) 0%,#2e7d32 100%);color:#fff;padding:18px 30px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stat-item{text-align:center}
.stat-number{font-size:2em;font-weight:900;color:#9CCC65;display:block}
.stat-label{font-size:0.85em;opacity:0.9}
/* URGENCY BAR */
.urgency-bar{background:linear-gradient(135deg,#e65100 0%,#bf360c 100%);color:#fff;padding:14px 24px;border-radius:12px;text-align:center;margin-bottom:20px;font-weight:700;font-size:1.05em;animation:urgencyPulse 2s ease-in-out infinite;box-shadow:0 6px 18px rgba(230,81,0,.3)}
@keyframes urgencyPulse{0%,100%{opacity:1}50%{opacity:0.85}}
/* HERO */
.hero-banner{background:linear-gradient(135deg,var(--dark-green) 0%,var(--black) 100%);color:#fff;padding:60px 40px;border-radius:22px;text-align:center;margin-bottom:40px;box-shadow:0 18px 45px rgba(0,0,0,.28);position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(124,179,66,.11) 0%,transparent 70%);animation:pulse 15s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.hero-content{position:relative;z-index:1}
.hero-banner h1{font-size:3em;margin-bottom:8px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
.hero-hindi{font-size:1.3em;color:#9CCC65;font-weight:700;margin-bottom:10px}
.hero-banner .tagline{font-size:1.5em;margin-bottom:10px;color:var(--accent-green);font-weight:800}
.hero-banner .subtitle{font-size:1.1em;opacity:.92;margin-bottom:24px}
.hero-cta-btn{background:linear-gradient(135deg,#9CCC65,#7CB342);color:#1a1a1a;padding:16px 40px;border-radius:999px;font-size:1.1em;font-weight:900;text-decoration:none;display:inline-block;transition:all .25s ease;box-shadow:0 6px 20px rgba(124,179,66,.4);border:none;cursor:pointer;margin-top:8px}
.hero-cta-btn:hover{transform:scale(1.05);box-shadow:0 10px 28px rgba(124,179,66,.5)}
/* ABOUT */
.about-section{background:linear-gradient(135deg,#fff 0%,#f4f7f4 100%);border-radius:16px;padding:40px;margin-bottom:40px;box-shadow:0 10px 30px rgba(85,139,47,.12);border-left:5px solid var(--primary-green)}
.about-section h2{color:var(--dark-green);font-size:2em;margin-bottom:20px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:600px){.about-grid{grid-template-columns:1fr}}
.about-point{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(85,139,47,.08)}
.about-icon{font-size:1.8em;flex-shrink:0}
.about-text h4{color:var(--dark-green);font-weight:800;margin-bottom:4px}
.about-text p{color:var(--gray);font-size:0.9em}
.section-card{background:#fff;border-radius:16px;padding:40px;margin-bottom:40px;box-shadow:0 10px 30px rgba(85,139,47,.12)}
.section-card h2{color:var(--dark-green);text-align:center;margin-bottom:30px;font-size:2.2em}
.holistic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.holistic-card{background:linear-gradient(135deg,var(--light-bg) 0%,#fff 100%);padding:24px;border-radius:14px;text-align:center;border:2px solid var(--accent-green);transition:all .25s ease}
.holistic-card:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(124,179,66,.18)}
.holistic-card .icon{font-size:3em;margin-bottom:12px}
.holistic-card h3{color:var(--dark-green);margin-bottom:8px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gallery-item{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.15);transition:all .25s ease;border:3px solid var(--primary-green);background:var(--light-bg)}
.gallery-item:hover{transform:scale(1.02);box-shadow:0 16px 32px rgba(124,179,66,.2)}
.gallery-item img{width:100%;height:280px;object-fit:cover;display:block}
.gallery-item .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);color:#fff;padding:14px;transform:translateY(100%);transition:all .25s ease}
.gallery-item:hover .overlay{transform:translateY(0)}
.gallery-badge{position:absolute;top:10px;left:10px;background:var(--primary-green);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.whatsapp-section{background:linear-gradient(135deg,#25D366 0%,#128C7E 100%);color:#fff;padding:40px;border-radius:16px;text-align:center;margin-bottom:40px;box-shadow:0 10px 26px rgba(37,211,102,.22)}
.whatsapp-btn{background:#fff;color:#25D366;padding:15px 38px;border-radius:999px;font-size:1.15em;font-weight:900;text-decoration:none;display:inline-block;transition:all .25s ease}
.whatsapp-btn:hover{transform:scale(1.05)}
.contact-form{max-width:600px;margin:0 auto}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:8px;font-weight:800;color:var(--gray)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border:2px solid var(--accent-green);border-radius:10px;font-size:16px}
.form-group textarea{min-height:120px}
/* FORM PROMISE */
.form-promise{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:2px solid var(--accent-green);border-radius:12px;padding:16px 20px;margin-bottom:20px;text-align:center;color:var(--dark-green);font-weight:700;font-size:0.95em}
.footer{text-align:center;padding:18px;color:var(--gray);font-size:.9em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.86);color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;z-index:4000;display:none;white-space:nowrap}
@media(max-width:768px){.hero-banner h1{font-size:2em}.hero-banner .tagline{font-size:1.2em}.admin-controls{grid-template-columns:1fr}.gallery-grid{grid-template-columns:1fr 1fr}.stats-bar{gap:18px}}
@media(max-width:480px){.gallery-grid{grid-template-columns:1fr}.stats-bar{flex-direction:column;align-items:center}}
</style>
</head>
